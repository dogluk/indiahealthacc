  <style>
    :root { --ink: #111; --muted: #666; --paper: #fffff8; --link: #3b5998; --rule: #e2dece; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e8e6df; --muted: #9a978d; --paper: #151513; --link: #8fa9dc; --rule: #3a3933; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: auto; max-width: 780px; padding: 0 1.5rem;
      background: var(--paper); color: var(--ink);
      font-family: et-book, Palatino, "Palatino Linotype", "Palatino LT STD", "Book Antiqua", Georgia, serif;
      font-size: 1.15rem; line-height: 1.65;
    }
    header { margin-top: 3rem; margin-bottom: 2.5rem; }
    header h1 { font-weight: 400; font-size: 2.8rem; line-height: 1; letter-spacing: -0.01em; }
    header h1 a, header h1 a:visited { color: var(--ink); text-decoration: none; }
    main h2 { font-weight: 400; font-size: 1.7rem; line-height: 1.25; margin: 0 0 1.5rem; }
    main h3 { font-weight: 400; font-size: 1.3rem; margin: 2.2rem 0 0.8rem; }
    main p { margin-bottom: 1.4rem; line-height: 1.7; }
    main ol, main ul { padding-left: 1.5rem; margin-bottom: 1.4rem; }
    main li { margin-bottom: 1rem; line-height: 1.6; }
    main hr { border: 0; border-top: 1px solid var(--rule); margin: 3rem 0; }
    a, a:visited { color: var(--link); text-decoration: underline; }
    footer { margin: 4rem 0 3rem; color: var(--muted); font-size: 0.95rem; }

    /* three-part essay */
    .toc { display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 4rem; }
    .toc a, .toc a:visited { color: var(--muted); text-decoration: none; }
    .toc a:hover { color: var(--link); text-decoration: underline; }
    .part { padding-top: 1rem; }
    .part + .part, .reading { border-top: 1px solid var(--rule); margin-top: 4rem; padding-top: 4rem; }
    .numeral { font-size: 3.2rem; line-height: 1; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 1.2rem; }
    main h2.has-sub { margin-bottom: 0.4rem; }
    .sub { font-style: italic; color: var(--muted); margin-bottom: 1.8rem; }
    .date { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.8rem; }
    .sub + .date { margin-top: -1.2rem; }
    .sign { font-size: 1.6rem; letter-spacing: 0.08em; margin-top: 2.5rem; }
    .closer { font-size: 1.35rem; line-height: 1.5; margin-top: 2.2rem; }
    .reading h2 { font-size: 1.7rem; }
  </style>

  {%- feed_meta -%}
</head>
